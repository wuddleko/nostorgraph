[package]
name = "nostorgraph"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "ntgraph"
path = "src/bin/ntgraph.rs"

[workspace]
members = ["parser", "page", "nip44", "crawler", "pdf", "pdf/wasm", "client"]

[workspace.package]
license = "Unlicense"

[dependencies]
rocket = { version = "0.5", default-features = false, features = ["json"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
ammonia = "4.2.5"
toml = "0.8"
crawler = { path = "crawler" }
client = { path = "client" }
nostorgraph-parser = { path = "parser" }
nostorgraph-nip44 = { path = "nip44" }
serde_json = { version = "1.0", features = ["raw_value"] }
url = "2.4"
hmac = "0.12"
sha2 = "0.10"
secp256k1 = { version = "0.29", features = ["rand", "rand-std", "global-context"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.0"
serial_test = "3.0"
client = { path = "client", features = ["test-util"] }

[build-dependencies]
wasm-bindgen-cli-support = "=0.2.100"
