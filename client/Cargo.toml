[package]
name = "client"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
test-util = []

[dependencies]
crawler = { path = "../crawler" }
nostorgraph-nip44 = { path = "../nip44" }
rand = "0.8"
secp256k1 = { version = "0.29", features = ["rand", "rand-std", "global-context"] }
serde_json = { version = "1.0", features = ["raw_value"] }
socket2 = "0.5"
tungstenite = { version = "0.26", features = ["native-tls"] }
native-tls = "0.2"
url = "2.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bech32 = "0.11"
serial_test = "3.0"
